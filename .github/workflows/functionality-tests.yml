name: GrowMark Functionality Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  functionality-tests:
    name: Functionality Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install functionality test dependencies
        working-directory: testing/functionality-tests
        run: npm install

      - name: Build and export web app
        run: npx expo export . --output-dir web-build --platform web

      - name: Serve exported web app
        run: |
          npx http-server web-build -p 5000 -c-1 &
          npx wait-on http://localhost:5000
        shell: bash

      - name: Run full functionality test suite
        working-directory: testing/functionality-tests
        env:
          WEB_APP_URL: http://localhost:5000
        run: npm run test:all 2>&1 | tee functionality-test.log

      - name: Upload functionality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growmark-functionality-test-artifacts
          path: |
            testing/functionality-tests/Functionality_Test_Report.xlsx
            testing/functionality-tests/reports/**/*.xml
            testing/functionality-tests/functionality-test.log
          retention-days: 14
