name: GrowMark Functionality Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  functionality-tests:
    name: Functionality Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install functionality test dependencies
        working-directory: testing/functionality-tests
        run: npm install

      - name: Run functionality tests
        working-directory: testing/functionality-tests
        run: npm test

      - name: Upload functionality Excel report
        uses: actions/upload-artifact@v4
        with:
          name: growmark-functionality-test-report
          path: testing/functionality-tests/Functionality_Test_Report.xlsx
