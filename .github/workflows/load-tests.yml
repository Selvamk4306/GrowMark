name: GrowMark Load Tests (Manual Only — PASSED)

# ✅ Tests passed. Disabled from automatic push/PR triggers.
# Run manually via: Actions → GrowMark Load Tests → Run workflow
on:
  workflow_dispatch:


jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Load Test node_modules
        uses: actions/cache@v4
        id: cache-load-nm
        with:
          path: testing/load-tests/node_modules
          key: load-nm-${{ runner.os }}-${{ hashFiles('testing/load-tests/package-lock.json') }}
          restore-keys: load-nm-${{ runner.os }}-

      - name: Install Load Test Dependencies
        if: steps.cache-load-nm.outputs.cache-hit != 'true'
        working-directory: ./testing/load-tests
        run: npm install

      - name: Run Baseline Load Test (300 virtual users, 60 seconds)
        working-directory: ./testing/load-tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "=========================================="
          echo "  GrowMark Baseline Load Test"
          echo "  Virtual Users : 300"
          echo "  Duration      : 60 seconds"
          echo "=========================================="
          node load-test.js 2>&1 | tee load-test.log

      - name: Upload Load Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Load-Test-Artifacts
          path: |
            testing/load-tests/Load_Test_Report.xlsx
            testing/load-tests/load-test.log
          retention-days: 30
