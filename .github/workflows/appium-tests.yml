name: GrowMark Appium Automated E2E Tests

on:
  push:
    branches:
      - main
    paths:
      - 'testing/appium-tests/**'
      - '.github/workflows/appium-tests.yml'
      - 'app/**'
      - 'components/**'
      - 'app.json'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'testing/appium-tests/**'
      - '.github/workflows/appium-tests.yml'
      - 'app/**'
      - 'components/**'
      - 'app.json'
      - 'package.json'
  workflow_dispatch:

# Cancel any in-progress run when a new one is triggered
concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium-tests:
    # Ubuntu runners start immediately (no queue) and support Android
    # emulator via KVM hardware acceleration — much faster than macos-13.
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Enable KVM hardware acceleration for Android emulator on Ubuntu
      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ─── CACHE: Root node_modules ────────────────────────────────────
      - name: Cache Root node_modules
        uses: actions/cache@v4
        id: cache-root-nm
        with:
          path: node_modules
          key: root-nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: root-nm-${{ runner.os }}-

      - name: Install Root Dependencies
        if: steps.cache-root-nm.outputs.cache-hit != 'true'
        run: npm install

      # ─── CACHE: Appium test node_modules ─────────────────────────────
      - name: Cache Appium Test node_modules
        uses: actions/cache@v4
        id: cache-appium-nm
        with:
          path: testing/appium-tests/node_modules
          key: appium-nm-${{ runner.os }}-${{ hashFiles('testing/appium-tests/package-lock.json') }}
          restore-keys: appium-nm-${{ runner.os }}-

      - name: Install Appium Test Dependencies
        if: steps.cache-appium-nm.outputs.cache-hit != 'true'
        working-directory: ./testing/appium-tests
        run: npm install

      # ─── CACHE: Built APK ────────────────────────────────────────────
      - name: Cache Built APK
        uses: actions/cache@v4
        id: cache-apk
        with:
          path: cached-app.apk
          key: apk-${{ runner.os }}-${{ hashFiles('app.json', 'package.json', 'package-lock.json', 'app/**', 'components/**', 'constants/**', 'hooks/**', 'context/**', 'lib/**', 'assets/**') }}

      - name: Cache Gradle (on APK cache miss only)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Native Android Directory (Expo Prebuild)
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Debug APK
        if: steps.cache-apk.outputs.cache-hit != 'true'
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: Save built APK to cache location
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cached-app.apk

      # ─── CACHE: Android Emulator AVD image ───────────────────────────
      - name: Cache Android Emulator AVD
        uses: actions/cache@v4
        id: cache-avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-${{ runner.os }}-x86_64
          restore-keys: avd-api30-${{ runner.os }}-

      # ─── RUN TESTS ───────────────────────────────────────────────────
      - name: Run Appium Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_PATH: ${{ github.workspace }}/cached-app.apk
          CI: true
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            cd testing/appium-tests
            npx wdio run wdio.appium.conf.js 2>&1 | tee appium-test.log

      - name: Upload Appium Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Artifacts
          path: |
            testing/appium-tests/Test_Report.xlsx
            testing/appium-tests/reports/**/*.xml
            testing/appium-tests/appium-test.log
          retention-days: 14
