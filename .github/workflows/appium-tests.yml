name: GrowMark Appium Automated E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  appium-tests:
    # macOS-13 = Intel x86_64 runner — required for x86_64 Android emulator.
    # macos-latest is now Apple Silicon (M1/arm64) which does NOT support x86_64 AVDs.
    runs-on: macos-13
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Root Dependencies
        run: npm install

      - name: Generate Native Android Directory (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: Install Appium Test Dependencies
        working-directory: ./testing/appium-tests
        run: |
          rm -f package-lock.json
          npm install

      - name: Run Appium Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_PATH: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
          CI: true
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          # Speed up emulator boot — no GPU window, software renderer, no audio/boot-anim
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            cd testing/appium-tests
            npx wdio run wdio.appium.conf.js 2>&1 | tee appium-test.log

      - name: Upload Appium Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Artifacts
          path: |
            testing/appium-tests/Test_Report.xlsx
            testing/appium-tests/reports/**/*.xml
            testing/appium-tests/appium-test.log
          retention-days: 14
