name: GrowMark Appium Automated E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Root Dependencies
        run: npm install

      - name: Generate Native Android Directory
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Install Appium Dependencies
        working-directory: ./testing/appium-tests
        run: |
          npm install
          npx appium driver install uiautomator2

      - name: Run Appium Tests in Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_PATH: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: |
            cd testing/appium-tests
            npx wdio run wdio.appium.conf.js 2>&1 | tee appium-test.log

      - name: Upload Appium Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Artifacts
          path: |
            testing/appium-tests/Test_Report.xlsx
            testing/appium-tests/reports/**/*.xml
            testing/appium-tests/appium-test.log
          retention-days: 14
