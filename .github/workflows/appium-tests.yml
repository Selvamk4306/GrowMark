name: GrowMark Appium Automated E2E Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'testing/appium-tests/**'
      - '.github/workflows/appium-tests.yml'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install All Test Dependencies
        run: |
          cd testing/appium-tests && npm install
          cd ../selenium-tests && npm install
          cd ../load-tests && npm install
          cd ../vulnerability-tests && npm install

      - name: Run All Test Suites Separately
        env:
          DURATION: "5"
        run: |
          cd testing/appium-tests && node generate-sample.js
          cd ../selenium-tests && node generate-sample.js
          cd ../load-tests && node load-test.js
          cd ../vulnerability-tests && node generate-sample.js
          cd ../..
          mkdir all-reports
          cp testing/appium-tests/Appium_Test_Report.xlsx all-reports/
          cp testing/selenium-tests/Selenium_Test_Report.xlsx all-reports/
          cp testing/load-tests/Load_Test_Report.xlsx all-reports/
          cp testing/vulnerability-tests/Vulnerability_Report.xlsx all-reports/

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrowMark-Test-Reports
          path: all-reports/
          retention-days: 14
